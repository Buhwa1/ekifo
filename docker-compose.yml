# One-command local database: `docker compose up -d`
# Matches DATABASE_URL in .env.example (user/password/db = ekifo/ekifo/findekifo).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ekifo
      POSTGRES_PASSWORD: ekifo
      POSTGRES_DB: findekifo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekifo -d findekifo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
